name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Boundary checks: no service_role / claude wrapper imports outside
      # src/jobs/**, and every Supabase query inside src/jobs/** filters
      # by tenant_id. Local ESLint plugin lives in tools/eslint/plugin.mjs.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (vitest)
        run: npm test

      # Build with placeholder envs. All routes are dynamic, so real values
      # are not needed to compile; placeholders just satisfy any top-level
      # env reads at module init.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
          SUPABASE_DB_URL: postgresql://ci@placeholder:5432/postgres
          ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
          INNGEST_EVENT_KEY: ci-placeholder-inngest-event
          INNGEST_SIGNING_KEY: ci-placeholder-inngest-signing
        run: npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Regenerate database.types.ts against the live schema via the
      # Supabase Management API. If a migration was applied but the types
      # file was not regenerated + committed, the next step will fail.
      - name: Regenerate types
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run gen-types

      - name: Detect schema/types drift
        run: |
          if ! git diff --exit-code src/lib/supabase/database.types.ts; then
            echo "::error::database.types.ts is out of sync with the live schema. Run 'npm run gen-types' locally and commit the result."
            exit 1
          fi
